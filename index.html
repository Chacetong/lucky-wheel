<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <title>Lucky Wheel — 谁会赢？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,900&amp;family=Noto+Sans+SC:wght@400;500;700;800;900&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="is-preload">
  <div class="app">
    <main class="layout">
      <section class="draw-stage" aria-label="Lucky Wheel 主舞台">
        <div class="hero-copy" aria-hidden="true">
          <div class="hero-copy__layer" data-mode="lottery">
            <span>WHO</span>
            <span>WINS?</span>
          </div>
          <div class="hero-copy__layer" data-mode="grouping">
            <span>RANDOM</span>
            <span>GROUPS</span>
          </div>
        </div>

        <div class="hero-title">
          <div class="mode-tabs" role="tablist" aria-label="模式切换">
            <button type="button" class="mode-tab" data-mode="lottery" role="tab" aria-selected="true">抽奖</button>
            <button type="button" class="mode-tab" data-mode="grouping" role="tab" aria-selected="false">分组</button>
          </div>
          <div class="hero-title__stack">
            <div class="hero-title__body" data-mode="lottery">
              <p class="hero-title__eyebrow">Who Wins</p>
              <h1>谁是<br />幸运儿</h1>
            </div>
            <div class="hero-title__body" data-mode="grouping" aria-hidden="true">
              <p class="hero-title__eyebrow">Random Groups</p>
              <h1>谁是<br />小伙伴</h1>
            </div>
          </div>
        </div>

        <div class="wheel-wrap">
          <canvas id="wheelCanvas" role="img" aria-label="按参与者权重划分的抽奖转盘"></canvas>
        </div>

        <div class="group-stage" id="groupStage" aria-hidden="true"></div>

        <div class="draw-controls">
          <button class="spin-btn" id="spinBtn" onclick="handleSpin()">
            <span class="spin-btn__text">见证奇迹</span>
            <span class="spin-btn__arrow-stage" aria-hidden="true">
              <svg class="spin-btn__arrow spin-btn__arrow--current" width="96" height="48" viewBox="0 0 96 48"
                fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <path d="M0 24H96M96 24C82.7452 24 72 13.2548 72 0M96 24C82.7452 24 72 34.7452 72 48"
                  stroke="currentColor" stroke-width="8" />
              </svg>
              <svg class="spin-btn__arrow spin-btn__arrow--next" width="96" height="48" viewBox="0 0 96 48"
                fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <path d="M0 24H96M96 24C82.7452 24 72 13.2548 72 0M96 24C82.7452 24 72 34.7452 72 48"
                  stroke="currentColor" stroke-width="8" />
              </svg>
            </span>
          </button>

          <label class="mode-row">
            <span class="toggle">
              <input type="checkbox" id="removeToggle" />
              <span class="toggle__track"></span>
            </span>
            <span class="mode-row__text">胜出后移除</span>
          </label>
        </div>

        <div class="group-controls">
          <button class="spin-btn" id="groupBtn" type="button">
            <span class="spin-btn__text">开始分组</span>
            <span class="spin-btn__arrow-stage" aria-hidden="true">
              <svg class="spin-btn__arrow spin-btn__arrow--current" width="96" height="48" viewBox="0 0 96 48"
                fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <path d="M0 24H96M96 24C82.7452 24 72 13.2548 72 0M96 24C82.7452 24 72 34.7452 72 48"
                  stroke="currentColor" stroke-width="8" />
              </svg>
              <svg class="spin-btn__arrow spin-btn__arrow--next" width="96" height="48" viewBox="0 0 96 48"
                fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <path d="M0 24H96M96 24C82.7452 24 72 13.2548 72 0M96 24C82.7452 24 72 34.7452 72 48"
                  stroke="currentColor" stroke-width="8" />
              </svg>
            </span>
          </button>

          <label class="group-count-input" title="组数">
            <span>组数</span>
            <input type="number" id="groupCount" value="2" min="2" step="1" inputmode="numeric" />
          </label>

          <div class="group-dist" role="radiogroup" aria-label="分配模式">
            <button type="button" class="group-dist__btn is-active" data-dist="even" data-tooltip="各组人数尽量接近" aria-pressed="true">均匀</button>
            <button type="button" class="group-dist__btn" data-dist="fill" data-tooltip="多数组人数一致，末组吃剩余" aria-pressed="false">相同</button>
          </div>
        </div>

        <p class="shortcut-hint">快捷键 SPACE / ENTER 快速启动</p>
        <p class="shortcut-hint shortcut-hint--cancel">按 ESC 取消抽奖</p>
      </section>

      <aside class="roster" aria-labelledby="rosterTitle">
        <header class="roster__header">
          <div>
            <p class="roster__index">THE LINEUP</p>
            <h2 id="rosterTitle">选手阵容</h2>
          </div>
          <div class="stats-row" aria-label="阵容统计">
            <span class="stat-count"><b id="statCount">0</b> 人</span>
            <span class="stat-weight"><b id="statWeight">0</b> 权重</span>
          </div>
        </header>

        <div class="notice hidden" id="notice" role="status" aria-live="polite">
          至少需要 <b>2</b> 位选手
        </div>

        <div class="entries-list" id="entriesList"></div>

        <div id="toastRoot"></div>

        <footer class="roster__actions">
          <button class="add-btn" id="addBtn" onclick="addEntry()">
            <span aria-hidden="true">＋</span> 添加选手
          </button>
          <button class="preset-btn" onclick="loadPresetRoster()" title="载入 ACDC 预设阵容">ACDC</button>
          <button class="clear-btn" onclick="clearAll()" title="清空全部">清空</button>
        </footer>
      </aside>
    </main>
  </div>

  <div id="globalToastRoot"></div>
  <script src="app.js"></script>
</body>

</html>
